openapi: 3.2.0
info:
  title: Browser Control Knowledge Base API
  version: 1.0.0
servers:
- url: https://api.airtop.ai/api
security:
- BearerAuth: []
tags:
- name: Knowledge Base
paths:
  /v2/organizations/{organizationId}/knowledge-base:
    get:
      description: Get all knowledge base documents for the organization. Use ?fields=summary for a lightweight listing without content.
      operationId: knowledge-base-list
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Set to 'summary' to return only lightweight document metadata (no content)
        example: summary
        explode: false
        in: query
        name: fields
        schema:
          description: Set to 'summary' to return only lightweight document metadata (no content)
          examples:
          - summary
          type: string
      - description: Number of documents to return
        example: 20
        explode: false
        in: query
        name: limit
        schema:
          default: 20
          description: Number of documents to return
          examples:
          - 20
          format: int64
          maximum: 100
          minimum: 1
          type: integer
      - description: Offset for pagination
        example: 0
        explode: false
        in: query
        name: offset
        schema:
          default: 0
          description: Offset for pagination
          examples:
          - 0
          format: int64
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKbDocumentsOutputBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: List knowledge base documents
      tags:
      - Knowledge Base
    post:
      description: Create a new knowledge base document for the organization
      operationId: knowledge-base-create
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKbDocumentHandlerInputBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentResponse'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Create knowledge base document
      tags:
      - Knowledge Base
  /v2/organizations/{organizationId}/knowledge-base/changes:
    get:
      description: List recent changes to the organization's knowledge base (creates, updates, and deletes). Use since to bound the window; when the window holds more changes than the limit, the newest are returned and hasMore is set.
      operationId: knowledge-base-changes-list
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Optional RFC3339 timestamp; only changes recorded at or after this time are returned
        example: '2026-06-01T00:00:00Z'
        explode: false
        in: query
        name: since
        schema:
          description: Optional RFC3339 timestamp; only changes recorded at or after this time are returned
          examples:
          - '2026-06-01T00:00:00Z'
          type: string
      - description: Maximum number of changes to return; when exceeded the oldest changes are dropped
        example: 50
        explode: false
        in: query
        name: limit
        schema:
          default: 50
          description: Maximum number of changes to return; when exceeded the oldest changes are dropped
          examples:
          - 50
          format: int64
          maximum: 500
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKbDocumentChangesOutputBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: List knowledge base document changes
      tags:
      - Knowledge Base
  /v2/organizations/{organizationId}/knowledge-base/events:
    get:
      description: Server-Sent Events stream of knowledge base mutations (create / update / delete) for the organization. One frame per mutation; clients advance lastEventId from the `eventId` field and reconnect with `?lastEventId=` to resume.
      operationId: knowledge-base-events
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: last known event id
        example: 0
        explode: false
        in: query
        name: lastEventId
        schema:
          default: -1
          description: last known event id
          examples:
          - 0
          format: int64
          type: integer
      - description: Get all events
        example: true
        explode: false
        in: query
        name: all
        schema:
          default: false
          description: Get all events
          examples:
          - true
          type: boolean
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                oneOf:
                - properties:
                    data:
                      $ref: '#/components/schemas/KbConnectedMessage'
                    event:
                      const: connected
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event connected
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/ErrorMessage'
                    event:
                      const: error
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event error
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/KbHeartbeatMessage'
                    event:
                      const: heartbeat
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event heartbeat
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/KbEventMessage'
                    event:
                      const: kb-event
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event kb-event
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/KbResyncMessage'
                    event:
                      const: resync
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event resync
                  type: object
                title: Server Sent Events
                type: object
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal Server Error
      summary: Subscribe to knowledge base realtime events
      tags:
      - Knowledge Base
      x-fern-audiences:
      - alpha
      x-fern-streaming:
        format: sse
  /v2/organizations/{organizationId}/knowledge-base/restore/commit:
    post:
      description: Apply a previously previewed knowledge base restore by its opaque server-side plan ID. Requires GTM Engineer authentication. The stored confirmation vector is rechecked inside the transaction; if any document changed after the preview the commit is rejected and the restore must be previewed again.
      operationId: knowledge-base-restore-commit
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitKbRestoreInputBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitKbRestoreResponse'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Commit knowledge base restore
      tags:
      - Knowledge Base
  /v2/organizations/{organizationId}/knowledge-base/restore/preview:
    post:
      description: 'Compute the per-document plan for restoring the knowledge base to a target snapshot vector. Committable previews return an opaque, short-lived plan ID. Requires GTM Engineer authentication. Restore never deletes documents: live documents absent from the target snapshot are reported as extra documents and left unchanged.'
      operationId: knowledge-base-restore-preview
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewKbRestoreInputBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbRestorePreview'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Preview knowledge base restore
      tags:
      - Knowledge Base
  /v2/organizations/{organizationId}/knowledge-base/slug/{slug}:
    get:
      description: Get a single knowledge base document by its slug identifier
      operationId: knowledge-base-get-by-slug
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Document slug
        example: communication-tone
        in: path
        name: slug
        required: true
        schema:
          description: Document slug
          examples:
          - communication-tone
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentResponse'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get knowledge base document by slug
      tags:
      - Knowledge Base
  /v2/organizations/{organizationId}/knowledge-base/{documentId}:
    delete:
      description: Soft-delete a knowledge base document. System documents cannot be deleted.
      operationId: knowledge-base-delete
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Document ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: documentId
        required: true
        schema:
          description: Document ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Explicit confirmation to delete even when the document is actively bound
        example: true
        explode: false
        in: query
        name: confirmInUse
        schema:
          description: Explicit confirmation to delete even when the document is actively bound
          examples:
          - true
          type: boolean
      responses:
        '204':
          description: No Content
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Delete knowledge base document
      tags:
      - Knowledge Base
    get:
      description: Get a single knowledge base document by ID
      operationId: knowledge-base-get
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Document ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: documentId
        required: true
        schema:
          description: Document ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentResponse'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get knowledge base document
      tags:
      - Knowledge Base
    put:
      description: Update a knowledge base document. Slug cannot be changed after creation.
      operationId: knowledge-base-update
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Document ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: documentId
        required: true
        schema:
          description: Document ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKbDocumentHandlerInputBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentResponse'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Update knowledge base document
      tags:
      - Knowledge Base
  /v2/organizations/{organizationId}/knowledge-base/{documentId}/legacy-description-reviewed:
    post:
      description: Record that the one-time legacy description quality backfill reviewed this knowledge base document.
      operationId: knowledge-base-mark-legacy-description-reviewed
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Document ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: documentId
        required: true
        schema:
          description: Document ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentResponse'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Mark legacy knowledge base description reviewed
      tags:
      - Knowledge Base
  /v2/organizations/{organizationId}/knowledge-base/{documentId}/usage:
    get:
      description: Get the current draft and saved-version agent bindings that reference a knowledge base document.
      operationId: knowledge-base-usage
      parameters:
      - description: Organization ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: organizationId
        required: true
        schema:
          description: Organization ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Document ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: documentId
        required: true
        schema:
          description: Document ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KbDocumentUsageResponse'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get knowledge base document usage
      tags:
      - Knowledge Base
components:
  schemas:
    KbRestoredDocument:
      additionalProperties: false
      properties:
        documentId:
          description: Knowledge base document ID
          type: string
        operation:
          description: Operation that was applied
          enum:
          - restore
          - resurrect
          type: string
        revision:
          description: Document revision after the restore
          format: int64
          type: integer
        slug:
          description: Document slug
          type: string
        title:
          description: Document title after the restore
          type: string
      required:
      - documentId
      - slug
      - title
      - revision
      - operation
      type: object
    KnowledgeBaseDocumentUsage:
      additionalProperties: false
      properties:
        agentId:
          description: Agent that currently references the document
          type: string
        agentName:
          description: Agent name shown in the confirmation UI
          type: string
        bindingKey:
          description: Knowledge base binding key that references the document
          type: string
        referenceSource:
          description: Whether the reference comes from the current draft or saved version
          type: string
      required:
      - agentId
      - agentName
      - bindingKey
      - referenceSource
      type: object
    ErrorMessage:
      additionalProperties: false
      properties:
        code:
          description: Error code
          type: string
        event:
          description: Event name
          type: string
        message:
          description: Error message
          type: string
      required:
      - event
      - message
      - code
      type: object
    KbConnectedMessage:
      additionalProperties: false
      properties:
        event:
          description: Event name
          type: string
      required:
      - event
      type: object
    KbRestoreExtraDocument:
      additionalProperties: false
      properties:
        documentId:
          description: Knowledge base document ID
          type: string
        revision:
          description: Current document revision
          format: int64
          type: integer
        slug:
          description: Document slug
          type: string
        title:
          description: Current document title
          type: string
        willRemainLive:
          description: 'Always true: restore does not remove documents that are absent from the target snapshot'
          type: boolean
      required:
      - documentId
      - slug
      - title
      - revision
      - willRemainLive
      type: object
    KbEventMessage:
      additionalProperties: false
      properties:
        actorGtmSessionId:
          description: GTE session id that triggered the mutation (self-echo filter)
          type: string
        actorUserId:
          description: Portal user id that triggered the mutation
          type: string
        documentId:
          description: Document ID
          type: string
        event:
          description: Event name
          type: string
        eventId:
          description: Event ID
          format: int64
          type: integer
        eventType:
          description: KB mutation type
          enum:
          - created
          - updated
          - deleted
          type: string
        revision:
          description: Document revision after the mutation (or pre-delete revision on delete)
          format: int64
          type: integer
        slug:
          description: Document slug
          type: string
        updatedAt:
          description: RFC3339 timestamp of the mutation
          type: string
      required:
      - event
      - eventType
      - documentId
      - slug
      - revision
      - updatedAt
      type: object
    ErrorEnvelope:
      additionalProperties: false
      properties:
        data: {}
        errors:
          items:
            $ref: '#/components/schemas/Issue'
          type:
          - array
          - 'null'
        httpStatus:
          format: int64
          type: integer
        message:
          type: string
        meta: {}
        warnings:
          items:
            $ref: '#/components/schemas/Issue'
          type:
          - array
          - 'null'
      required:
      - httpStatus
      - message
      - meta
      - data
      - errors
      - warnings
      type: object
    KbRestoreConflict:
      additionalProperties: false
      properties:
        blocking:
          description: Blocking conflicts make the whole preview non-committable
          type: boolean
        collidingDocumentId:
          description: Live document that currently uses the target document's slug
          type: string
        kind:
          description: Kind of conflict
          enum:
          - later_changes
          - slug_collision
          type: string
        laterChanges:
          description: Changes recorded after the target snapshot by other actors
          items:
            $ref: '#/components/schemas/KbRestoreLaterChange'
          type:
          - array
          - 'null'
        message:
          description: Human-readable explanation of the conflict
          type: string
      required:
      - kind
      - blocking
      - message
      type: object
    Issue:
      additionalProperties: false
      properties:
        code:
          description: Issue code.
          type:
          - string
          - 'null'
        details:
          additionalProperties: {}
          description: Any associated details.
          type:
          - object
          - 'null'
        message:
          description: Message describing the issue.
          type: string
        reason:
          description: Underlying reason for the issue.
          type:
          - string
          - 'null'
        value:
          additionalProperties: {}
          description: Structured payload describing the issue, for issues that carry one.
          type:
          - object
          - 'null'
      required:
      - message
      type: object
    KbRestoreOperation:
      additionalProperties: false
      properties:
        boundAgents:
          description: Agent bindings that reference this document's slug
          items:
            $ref: '#/components/schemas/KnowledgeBaseDocumentUsage'
          type:
          - array
          - 'null'
        conflict:
          $ref: '#/components/schemas/KbRestoreConflict'
          description: Conflict that requires confirmation or blocks the restore
        currentDeleted:
          description: Whether the document is currently soft-deleted
          type: boolean
        currentRevision:
          description: Revision of the current row (live or soft-deleted)
          format: int64
          type: integer
        documentId:
          description: Knowledge base document ID
          type: string
        isSystem:
          description: Whether this is a system document
          type: boolean
        operation:
          description: What the restore would do to this document
          enum:
          - restore
          - resurrect
          - noop
          type: string
        slug:
          description: Document slug
          type: string
        targetRevision:
          description: Revision the document would be restored to
          format: int64
          type: integer
        title:
          description: Document title at the target revision
          type: string
      required:
      - documentId
      - slug
      - title
      - isSystem
      - operation
      - targetRevision
      - currentRevision
      - currentDeleted
      type: object
    KbRestoreSummary:
      additionalProperties: false
      properties:
        noopCount:
          description: Target documents that already matched and were left untouched
          format: int64
          type: integer
        restoredCount:
          description: Documents updated to their target revision content
          format: int64
          type: integer
        resurrectedCount:
          description: Soft-deleted documents brought back with their original IDs
          format: int64
          type: integer
      required:
      - restoredCount
      - resurrectedCount
      - noopCount
      type: object
    KbRestoreLaterChange:
      additionalProperties: false
      properties:
        actorGtmSessionId:
          description: GTM Engineer session that made the change
          type: string
        actorUserId:
          description: Portal user that made the change
          type: string
        changeType:
          description: Kind of change
          enum:
          - created
          - updated
          - deleted
          type: string
        changedAt:
          description: When the change was recorded
          format: date-time
          type: string
        revision:
          description: Document revision after the change
          format: int64
          type: integer
      required:
      - revision
      - changeType
      - changedAt
      type: object
    KbRestorePreview:
      additionalProperties: false
      properties:
        committable:
          description: Whether this preview can be committed
          type: boolean
        extraDocuments:
          description: Live documents absent from the target snapshot; they remain unchanged
          items:
            $ref: '#/components/schemas/KbRestoreExtraDocument'
          type: array
        mode:
          description: Restore mode the preview was computed for
          enum:
          - undo
          - revert
          type: string
        notCommittableReason:
          description: Why the preview cannot be committed
          type: string
        operations:
          description: Per-document restore plan
          items:
            $ref: '#/components/schemas/KbRestoreOperation'
          type: array
        planId:
          description: Opaque server-side plan ID required to commit a committable preview
          format: uuid
          type: string
        requiresConfirmation:
          description: Whether commit requires explicit confirmation (conflicts or bound-agent risk)
          type: boolean
      required:
      - mode
      - committable
      - requiresConfirmation
      - operations
      - extraDocuments
      type: object
    KbRestoreTargetDocument:
      additionalProperties: false
      properties:
        documentId:
          description: Knowledge base document ID
          format: uuid
          type: string
        revision:
          description: Revision the document should be restored to
          format: int64
          minimum: 1
          type: integer
      required:
      - documentId
      - revision
      type: object
    KbDocumentUsageResponse:
      additionalProperties: false
      properties:
        boundAgents:
          description: Active agent bindings that reference this document
          items:
            $ref: '#/components/schemas/KnowledgeBaseDocumentUsage'
          type:
          - array
          - 'null'
        documentId:
          description: Knowledge base document ID
          type: string
        slug:
          description: Current knowledge base document slug
          type: string
      required:
      - documentId
      - slug
      - boundAgents
      type: object
    KbResyncMessage:
      additionalProperties: false
      properties:
        event:
          description: Event name
          type: string
        reason:
          description: Why the resync is needed
          type: string
      required:
      - event
      - reason
      type: object
    PreviewKbRestoreInputBody:
      additionalProperties: false
      properties:
        assistantTurnId:
          description: Mark assistant turn the restore targets; recorded in logs
          maxLength: 128
          type: string
        documents:
          description: 'Target snapshot vector: each document and the revision it should be restored to. An empty vector previews as a non-committable no-op.'
          items:
            $ref: '#/components/schemas/KbRestoreTargetDocument'
          maxItems: 500
          type: array
        mode:
          description: Restore gesture the target snapshot came from
          enum:
          - undo
          - revert
          type: string
      required:
      - mode
      - documents
      type: object
    ListKbDocumentsOutputBody:
      additionalProperties: false
      properties:
        documents:
          description: List of KB documents
          items:
            $ref: '#/components/schemas/KbDocumentResponse'
          type: array
        limit:
          description: Page size
          format: int64
          type: integer
        offset:
          description: Current offset
          format: int64
          type: integer
        totalCount:
          description: Total number of documents
          format: int64
          type: integer
      required:
      - documents
      - totalCount
      - limit
      - offset
      type: object
    CommitKbRestoreResponse:
      additionalProperties: false
      properties:
        mode:
          description: Restore mode that was committed
          enum:
          - undo
          - revert
          type: string
        restoredDocuments:
          description: Documents the restore mutated
          items:
            $ref: '#/components/schemas/KbRestoredDocument'
          type: array
        summary:
          $ref: '#/components/schemas/KbRestoreSummary'
          description: Restore outcome counts
      required:
      - mode
      - restoredDocuments
      - summary
      type: object
    KbHeartbeatMessage:
      additionalProperties: false
      properties:
        event:
          description: Event name
          type: string
      required:
      - event
      type: object
    KnowledgeBaseDocumentChange:
      additionalProperties: false
      properties:
        actorGtmSessionId:
          description: GTM Engineer session that made the change
          type: string
        actorUserId:
          description: Portal user that made the change
          type: string
        changeType:
          description: Kind of change
          enum:
          - created
          - updated
          - deleted
          type: string
        changedAt:
          description: When the change was recorded
          format: date-time
          type: string
        documentId:
          description: Document ID the change applies to
          type: string
        eventId:
          description: Identifier of the change-log entry
          format: int64
          type: integer
        revision:
          description: Document revision after the change (pre-delete revision for deletes)
          format: int64
          type: integer
        slug:
          description: Document slug at the time of the change
          type: string
        title:
          description: Document title at the time of the change
          type: string
      required:
      - eventId
      - documentId
      - slug
      - revision
      - changeType
      - title
      - changedAt
      type: object
    CommitKbRestoreInputBody:
      additionalProperties: false
      properties:
        confirm:
          description: Must be true when the preview reported conflicts or bound-agent risk
          type: boolean
        planId:
          description: Opaque plan ID returned by restore preview
          format: uuid
          type: string
      required:
      - planId
      type: object
    ListKbDocumentChangesOutputBody:
      additionalProperties: false
      properties:
        changes:
          description: Changes in ascending chronological order; when truncated, the newest changes are retained
          items:
            $ref: '#/components/schemas/KnowledgeBaseDocumentChange'
          type: array
        hasMore:
          description: Whether older changes in the requested window were dropped to fit the limit
          type: boolean
      required:
      - changes
      - hasMore
      type: object
    CreateKbDocumentHandlerInputBody:
      additionalProperties: false
      properties:
        content:
          description: Markdown content
          examples:
          - '# Tone


            Professional yet approachable.'
          maxLength: 20000
          type: string
        description:
          description: Brief description
          examples:
          - Default communication style
          maxLength: 1000
          type: string
        slug:
          description: URL-safe identifier (auto-generated from title if omitted)
          examples:
          - communication-tone
          maxLength: 255
          type: string
        title:
          description: Document title
          examples:
          - Communication Tone
          maxLength: 255
          minLength: 1
          type: string
      required:
      - title
      type: object
    KbDocumentResponse:
      additionalProperties: false
      properties:
        content:
          description: Markdown content
          type: string
        createdAt:
          description: When the document was created
          type: string
        description:
          description: Brief description
          type: string
        id:
          description: Unique identifier
          type: string
        isSystem:
          description: Whether this is a system document
          type: boolean
        legacyDescriptionReviewedAt:
          description: When the one-time legacy description quality backfill reviewed this document
          type: string
        revision:
          description: Monotonic revision counter; pass back via expectedRevision to guard updates against concurrent modifications
          format: int64
          type: integer
        slug:
          description: URL-safe identifier
          type: string
        title:
          description: Document title
          type: string
        updatedAt:
          description: When the document was last updated
          type: string
      required:
      - id
      - title
      - slug
      - description
      - content
      - isSystem
      - revision
      - createdAt
      - updatedAt
      type: object
    UpdateKbDocumentHandlerInputBody:
      additionalProperties: false
      properties:
        content:
          description: Markdown content
          examples:
          - '# Updated Content'
          maxLength: 20000
          type: string
        description:
          description: Brief description
          examples:
          - Updated description
          maxLength: 1000
          type: string
        expectedRevision:
          description: Optional optimistic concurrency token — the document's current revision. A mismatch returns 409.
          examples:
          - 3
          format: int64
          type: integer
        title:
          description: Document title
          examples:
          - Updated Title
          maxLength: 255
          minLength: 1
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
      x-fern-bearer:
        name: apiKey
