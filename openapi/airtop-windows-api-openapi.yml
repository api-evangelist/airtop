openapi: 3.2.0
info:
  title: Browser Control Windows API
  version: 1.0.0
servers:
- url: https://api.airtop.ai/api
security:
- BearerAuth: []
tags:
- name: Windows
paths:
  /v1/async/sessions/{sessionId}/windows/{windowId}/browser-use:
    post:
      description: Execute a contained browser action such as navigating to a form, submitting a form, or dismissing overlays, asynchronously using GPT computer use.
      operationId: async-browser-use
      parameters:
      - description: The session id for the window.
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: sessionId
        required: true
        schema:
          description: The session id for the window.
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: The Airtop window id of the browser window.
        example: 0334da2a-91b0-42c5-6156-76a5eba87430
        in: path
        name: windowId
        required: true
        schema:
          description: The Airtop window id of the browser window.
          examples:
          - 0334da2a-91b0-42c5-6156-76a5eba87430
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Async-browser-useRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSessionAiResponseEnvelope'
          description: Created
          headers:
            content-type:
              schema:
                default: application/json
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Execute a browser action (async)
      tags:
      - Windows
      x-fern-audiences:
      - public
