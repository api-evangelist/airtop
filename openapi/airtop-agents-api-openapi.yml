  /v2/organization/agents/events:
    get:
      operationId: org-agent-events
      parameters:
      - description: last known event id
        example: 0
        explode: false
        in: query
        name: lastEventId
        schema:
          default: -1
          description: last known event id
          examples:
          - 0
          format: int64
          type: integer
      - description: Get all events
        example: true
        explode: false
        in: query
        name: all
        schema:
          default: false
          description: Get all events
          examples:
          - true
          type: boolean
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                oneOf:
                - properties:
                    data:
                      $ref: '#/components/schemas/AgentInvocationEventMessage'
                    event:
                      const: agentInvocationEvent
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event agentInvocationEvent
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/AgentSelfHealingRepairUpdatedMessage'
                    event:
                      const: agentSelfHealingRepairUpdated
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event agentSelfHealingRepairUpdated
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/OrgAgentEventMessage'
                    event:
                      const: agentUpdatedEvent
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event agentUpdatedEvent
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/AvariceRunEventMessage'
                    event:
                      const: avariceRunEvent
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event avariceRunEvent
                  type: object
                - properties:
                    data:
                      $ref: '#/components/schemas/ErrorMessage'
                    event:
                      const: error
                      description: The event name.
                      type: string
                    id:
                      description: The event ID.
                      type: integer
                    retry:
                      description: The retry time in milliseconds.
                      type: integer
                  required:
                  - data
                  - event
                  title: Event error
                  type: object
                title: Server Sent Events
                type: object
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal Server Error
      summary: Get all agent events for an organization
      tags:
      - Agents
      x-fern-audiences:
      - alpha
      x-fern-streaming:
        format: sse
