openapi: 3.2.0
info:
  title: Browser Control Agents API
  version: 1.0.0
servers:
- url: https://api.airtop.ai/api
security:
- BearerAuth: []
tags:
- name: Agents
paths:
  /v1/agents/{id}/pre-share-summary:
    get:
      description: Returns the agent's bound vault fields bucketed into {toCopy, alreadyShared, missing, duplicateServiceKeys} so the portal can itemize the share-confirmation dialog. Owner-only.
      operationId: agent-pre-share-summary
      parameters:
      - description: agent id
        in: path
        name: id
        required: true
        schema:
          description: agent id
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreShareSummary'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Preview what sharing an agent would copy
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v1/agents/{id}/profile:
    get:
      description: 'Read-only: resolves the per-(agent, user) profile name the caller would use and whether it exists. Creates nothing.'
      operationId: agent-profile-get
      parameters:
      - description: agent id
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: agent id
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Resolve the profile for this specific agent version instead of the caller's current version. Honored only for the agent's owner. If 0 or not provided, resolves the caller's current version.
        example: 3
        explode: false
        in: query
        name: version
        schema:
          default: 0
          description: Resolve the profile for this specific agent version instead of the caller's current version. Honored only for the agent's owner. If 0 or not provided, resolves the caller's current version.
          examples:
          - 3
          format: int
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentProfileBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Resolve the caller's browser-profile name for an agent
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v1/agents/{id}/profile-setup-session:
    post:
      description: Opens a browser session bound to the caller's deterministic per-(agent, user) profile. On normal-stop close the session state is saved into the profile. The caller must explicitly invoke the companion complete endpoint to flip manually_configured_at — closing the live view alone does not mark the profile as configured.
      operationId: agent-profile-setup-session
      parameters:
      - description: agent id
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: agent id
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSetupSessionRequestBody'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSetupSessionBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Open an interactive session to populate the per-user agent profile
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v1/agents/{id}/profile-setup-session/complete:
    post:
      description: Writes the user-confirmed marker for the session. The orchestrator flips agent_user_session_preferences.manually_configured_at only when this marker is present AND the session's profile save succeeds — both signals are required.
      operationId: agent-profile-setup-session-complete
      parameters:
      - description: agent id
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: agent id
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSetupSessionCompleteInputV1Body'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSetupSessionCompleteBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Record the user's Done signal for a profile-setup session
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v1/agents/{id}/share:
    post:
      description: Share or un-share an agent with the rest of the caller's organization. Owner-only.
      operationId: agent-share
      parameters:
      - description: agent id
        in: path
        name: id
        required: true
        schema:
          description: agent id
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareAgentInputV1Body'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Toggle agent sharing
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v1/agents/{id}/versions/{version}/requirements:
    get:
      description: Returns the structured pre-flight payload (missing vault fields, missing MCP services, profile status) for the (agent, version, caller) tuple. Drives dashboard remediation cards and Run-button gating.
      operationId: agent-requirements-get
      parameters:
      - description: agent id
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: agent id
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: version number
        example: 1
        in: path
        name: version
        required: true
        schema:
          description: version number
          examples:
          - 1
          format: int
          type: integer
      - description: pre-flight intent (run | edit). Default run.
        example: run
        explode: false
        in: query
        name: intent
        schema:
          description: pre-flight intent (run | edit). Default run.
          examples:
          - run
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingRequirements'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get pre-flight requirements for an agent version
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v1/agents/{id}/vibe-coding/current-user-attachable-session:
    get:
      description: Returns stable session metadata only when the current user owns an active VICE session for the agent. If another user owns the active session, no attach metadata is returned and the response indicates that an active session belongs to another user. Agent Builder window recovery and live view URL creation are handled by Portal API.
      operationId: agents-current-user-attachable-vibe-coding-session-get
      parameters:
      - description: ID of the agent whose active VICE session should be discovered.
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: ID of the agent whose active VICE session should be discovered.
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCurrentUserAttachableVibeCodingSessionBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get the current user's attachable VICE session for an agent
      tags:
      - Agents
  /v2/agent-deploy-limit-status:
    get:
      description: Get the current published agent count and deploy limit for the organization.
      operationId: agents-deploy-limit-status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeployLimitStatusBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get deploy limit status
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v2/agent-templates/{id}/knowledge-base:
    get:
      description: List the template-owned knowledge base document snapshots included with this template.
      operationId: template-knowledge-base-list
      parameters:
      - description: Template ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: Template ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplateKnowledgeBaseDocumentsOutputV1Body'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: List template knowledge base documents
      tags:
      - Agents
  /v2/agent-templates/{id}/knowledge-base/{documentId}:
    get:
      description: Get a full template-owned knowledge base document snapshot by ID.
      operationId: template-knowledge-base-get
      parameters:
      - description: Template ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: Template ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Template knowledge base document ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: documentId
        required: true
        schema:
          description: Template knowledge base document ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateKnowledgeBaseDocument'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get template knowledge base document
      tags:
      - Agents
    put:
      description: Update a template-owned knowledge base document snapshot.
      operationId: template-knowledge-base-update
      parameters:
      - description: Template ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: id
        required: true
        schema:
          description: Template ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      - description: Template knowledge base document ID
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        in: path
        name: documentId
        required: true
        schema:
          description: Template knowledge base document ID
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateKnowledgeBaseDocumentInputV1Body'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateKnowledgeBaseDocument'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Update template knowledge base document
      tags:
      - Agents
  /v2/agents:
    delete:
      operationId: agents-delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentInputV1Body'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Delete agents
      tags:
      - Agents
      x-fern-audiences:
      - alpha
    get:
      description: Get agents for an organization, optionally filtered by user
      operationId: agents-get
      parameters:
      - description: A comma-separated list of IDs of the agents to retrieve.
        example:
        - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        - e39522ce-44f0-456f-9efd-07b3d4fdd9f2
        explode: true
        in: query
        name: agentIds
        schema:
          description: A comma-separated list of IDs of the agents to retrieve.
          examples:
          - - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
            - e39522ce-44f0-456f-9efd-07b3d4fdd9f2
          items:
            type: string
          type:
          - array
          - 'null'
      - description: Filter agents by name (case-insensitive partial match)
        example: my-agent
        explode: false
        in: query
        name: name
        schema:
          description: Filter agents by name (case-insensitive partial match)
          examples:
          - my-agent
          type: string
      - description: Whether to include deleted agents in the results
        example: true
        explode: false
        in: query
        name: showDeleted
        schema:
          description: Whether to include deleted agents in the results
          examples:
          - true
          type: boolean
      - description: Filter agents by user ID
        example: user123
        explode: false
        in: query
        name: userId
        schema:
          description: Filter agents by user ID
          examples:
          - user123
          type: string
      - description: Exclude agents belonging to this user ID
        example: user123
        explode: false
        in: query
        name: excludeUserId
        schema:
          description: Exclude agents belonging to this user ID
          examples:
          - user123
          type: string
      - description: Filter to only agents created by the authenticated user making the request
        example: true
        explode: false
        in: query
        name: createdByMe
        schema:
          description: Filter to only agents created by the authenticated user making the request
          examples:
          - true
          type: boolean
      - description: Return agents created by the authenticated user plus published shared agents the user may invoke
        example: true
        explode: false
        in: query
        name: availableToMe
        schema:
          description: Return agents created by the authenticated user plus published shared agents the user may invoke
          examples:
          - true
          type: boolean
      - description: Filter agents by enabled status
        example: 'true'
        explode: false
        in: query
        name: enabled
        schema:
          description: Filter agents by enabled status
          examples:
          - 'true'
          type: string
      - description: Filter to only published agents (agents with a published version)
        example: true
        explode: false
        in: query
        name: published
        schema:
          description: Filter to only published agents (agents with a published version)
          examples:
          - true
          type: boolean
      - description: Filter agents by whether they are relevant to GTM Engineer
        example: 'true'
        explode: false
        in: query
        name: relevantToGtmEngineer
        schema:
          description: Filter agents by whether they are relevant to GTM Engineer
          examples:
          - 'true'
          type: string
      - description: Sort agents by field (lastRun, lastModified, or createdAt)
        example: lastRun
        explode: false
        in: query
        name: sortBy
        schema:
          description: Sort agents by field (lastRun, lastModified, or createdAt)
          enum:
          - lastRun
          - lastModified
          - createdAt
          examples:
          - lastRun
          type: string
      - description: Sort order (asc or desc)
        example: desc
        explode: false
        in: query
        name: sortOrder
        schema:
          description: Sort order (asc or desc)
          enum:
          - asc
          - desc
          examples:
          - desc
          type: string
      - description: Filter by folder ID. Use 'uncategorized' for agents without a folder. Omit or leave empty for all agents.
        example: 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
        explode: false
        in: query
        name: folderId
        schema:
          description: Filter by folder ID. Use 'uncategorized' for agents without a folder. Omit or leave empty for all agents.
          examples:
          - 6aac6f73-bd89-4a76-ab32-5a6c422e8b0b
          type: string
      - description: Narrow the listing to shared agents only. Combines with userId or excludeUserId — the 'From You' tab shows the viewer's own shared agents, the 'From Your Team' tab shows others' shared agents.
        example: true
        explode: false
        in: query
        name: sharedOnly
        schema:
          description: Narrow the listing to shared agents only. Combines with userId or excludeUserId — the 'From You' tab shows the viewer's own shared agents, the 'From Your Team' tab shows others' shared agents.
          examples:
          - true
          type: boolean
      - description: Whether to include the agent owner's full name when available.
        example: true
        explode: false
        in: query
        name: includeOwnerFullName
        schema:
          description: Whether to include the agent owner's full name when available.
          examples:
          - true
          type: boolean
      - description: Offset for pagination.
        example: 1
        explode: false
        in: query
        name: offset
        schema:
          default: -1
          description: Offset for pagination.
          examples:
          - 1
          format: int64
          type: integer
      - description: Limit for pagination.
        example: 10
        explode: false
        in: query
        name: limit
        schema:
          default: 10
          description: Limit for pagination.
          examples:
          - 10
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentsBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get agents
      tags:
      - Agents
      x-fern-audiences:
      - alpha
    post:
      operationId: agent-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentInputV1Body'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Create an agent
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v2/agents/profile-agents:
    post:
      operationId: profile-agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileAgentsRequestBody'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAgentsBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Resolve the agent and owner for each browser profile
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v2/agents/triggers/count:
    post:
      description: Count enabled live agents in an organization using a trigger type
      operationId: agents-trigger-count
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountAgentsByTriggerInputV1Body'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountAgentsByTriggerBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Count enabled agents using a trigger type
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v2/agents/triggers/disable:
    post:
      description: Disable enabled live agents in an organization using a trigger type
      operationId: agents-trigger-disable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableAgentsByTriggerInputV1Body'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisableAgentsByTriggerBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Disable enabled agents using a trigger type
      tags:
      - Agents
      x-fern-audiences:
      - alpha
  /v2/agents/{id}:
    get:
      operationId: agent-get
      parameters:
      - description: agent id to get
        in: path
        name: id
        required: true
        schema:
          description: agent id to get
          format: uuid
          type: string
      - description: If 'true', return the draft version if available or fallback to published version. If 'false' or not specified, return the published version if available or fallback to draft version.
        example: 'true'
        explode: false
        in: query
        name: draft
        schema:
          description: If 'true', return the draft version if available or fallback to published version. If 'false' or not specified, return the published version if available or fallback to draft version.
          examples:
          - 'true'
          type: string
      - description: Specific version number to retrieve. If 0 or not provided, the draft parameter is used to determine which version to return.
        example: 1
        explode: false
        in: query
        name: version
        schema:
          default: 0
          description: Specific version number to retrieve. If 0 or not provided, the draft parameter is used to determine which version to return.
          examples:
          - 1
          format: int
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get an agent
      tags:
      - Agents
      x-fern-audiences:
      - alpha
    patch:
      operationId: agent-update
      parameters:
      - description: agent id to update
        in: path
        name: id
        required: true
        schema:
          description: agent id to update
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentInputV1Body'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAgentBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Update an agent
      tags:
      - Agents
      x-fern-audiences:
      - alpha
