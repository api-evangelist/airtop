openapi: 3.2.0
info:
  title: Browser Control GTM Engineer API
  version: 1.0.0
servers:
- url: https://api.airtop.ai/api
security:
- BearerAuth: []
tags:
- name: GTM Engineer
paths:
  /v1/gtm-engineer:
    post:
      operationId: gtm-engineer-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGtmEngineerInputBody'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtmEngineerSession'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Create a gtm-engineer session
      tags:
      - GTM Engineer
  /v1/gtm-engineer/chat:
    delete:
      description: Deletes the chat thread for the current user, causing the next session to start with a fresh conversation.
      operationId: gtm-engineer-chat-delete
      parameters:
      - description: Assistant whose conversation history should be cleared.
        explode: false
        in: query
        name: assistantMode
        schema:
          default: mark
          description: Assistant whose conversation history should be cleared.
          enum:
          - mark
          - agent-director
          type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Clear GTM engineer conversation history
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}:
    delete:
      operationId: gtm-engineer-delete
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Terminate a gtm-engineer session
      tags:
      - GTM Engineer
    get:
      operationId: gtm-engineer-get
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtmEngineerStatusResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get gtm-engineer session status
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/agent-invocations/activity:
    get:
      description: Returns recent invocations for agents in the current assistant mode's agent set.
      operationId: gtm-engineer-agent-invocation-activity-get
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGtmEngineerAgentInvocationActivityBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get agent invocation activity for a GTM Engineer session
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/agent-invocations/running:
    get:
      description: Returns currently active manual invocations for agents available to the current assistant mode.
      operationId: gtm-engineer-running-agent-invocations-get
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGtmEngineerRunningAgentInvocationsBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get running agent invocations for a GTM Engineer session
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/agents/{agentId}/draft/start:
    post:
      description: Creates a draft for an eligible current-user agent and starts a detached Agent Builder session for requested changes. If Agent Builder is already active for this agent, the existing session is returned without touching the draft. If the agent already has an unpublished dormant draft, no new draft work is started.
      operationId: gtm-engineer-agent-draft-start
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      - description: Agent ID to open a draft for
        in: path
        name: agentId
        required: true
        schema:
          description: Agent ID to open a draft for
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGtmEngineerAgentDraftRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartGtmEngineerAgentDraftResponse'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Start Agent Builder work on a new draft for a GTM Engineer agent
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/agents/{agentId}/invocations/async:
    post:
      description: Creates an async invocation for an agent the current GTM Engineer user may invoke.
      operationId: gtm-engineer-agent-invocation-create-async
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      - description: Agent ID to invoke from this GTM Engineer session
        in: path
        name: agentId
        required: true
        schema:
          description: Agent ID to invoke from this GTM Engineer session
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGtmEngineerAgentAsyncInvocationRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAsyncAgentInvocationBody'
          description: Created
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Create an async agent invocation from GTM Engineer
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/agents/{agentId}/vice-session/start:
    post:
      description: Creates or returns a detached VICE browser session for an agent created by the current GTM Engineer session. This starts the browser/VICE infrastructure; autonomous VICE chat bootstrap is handled by GTM Engineer as a separate step.
      operationId: gtm-engineer-agent-vice-session-start
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      - description: Agent ID to start in detached VICE mode
        in: path
        name: agentId
        required: true
        schema:
          description: Agent ID to start in detached VICE mode
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGtmEngineerAgentViceSessionRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartGtmEngineerAgentViceSessionResponse'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Start a detached VICE session for a GTM Engineer agent
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/ai-usage:
    post:
      operationId: gtm-engineer-record-ai-usage
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordGtmEngineerAiUsageInputBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Record a single AI usage row for a gtm-engineer session
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/auth:
    post:
      operationId: gtm-engineer-auth-validate
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateFrontendAuthFromGtmEngineerInputBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidKeyBodyV1'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Validate frontend auth from gtm-engineer
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/auth/api-proxy:
    post:
      operationId: gtm-engineer-api-proxy
      parameters:
      - description: The GTM assistant session ID.
        in: path
        name: id
        required: true
        schema:
          description: The GTM assistant session ID.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationApiProxyRequestBody'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationApiProxyResponseBody'
          description: OK
          headers:
            content-type:
              schema:
                default: application/json
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Proxy an integration provider request for a GTM assistant session
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/auth/linkedin-2-config:
    get:
      operationId: gtm-engineer-linkedin-2-config-get
      parameters:
      - description: The GTM assistant session ID.
        in: path
        name: id
        required: true
        schema:
          description: The GTM assistant session ID.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedIn2Config'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get LinkedIn integration configuration for a GTM assistant session
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/avarice/recoverable-work:
    get:
      description: Returns durable current-draft Avarice runs and live pre-run Avarice sessions for agents owned by the current assistant mode.
      operationId: gtm-engineer-recoverable-avarice-work-get
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGtmEngineerRecoverableAvariceWorkBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get recoverable Avarice work for a GTM Engineer session
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/check-credits:
    post:
      operationId: gtm-engineer-check-credits
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckGtmEngineerCreditsInputBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Check whether a Mark session may continue spending credits
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/external-messages/outbound:
    post:
      operationId: external-director-outbound-message-publish
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDirectorOutboundMessageInputBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Publish an Agent Director outbound message to an external channel
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/files:
    post:
      operationId: gtm-engineer-resource-file-create
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGtmEngineerResourceFileInputBody'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGtmEngineerResourceFileEnvelopeDefaultMeta'
                description: GTM Engineer resource file
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Create a GTM engineer resource file upload
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/files/{fileId}:
    get:
      operationId: gtm-engineer-resource-file-get
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      - description: Uploaded file ID
        in: path
        name: fileId
        required: true
        schema:
          description: Uploaded file ID
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGtmEngineerResourceFileEnvelopeDefaultMeta'
                description: GTM Engineer resource file
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Get a GTM engineer resource file
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/last-active:
    post:
      operationId: gtm-engineer-last-active
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGtmEngineerLastActiveRequest'
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Update gtm-engineer session last active time
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/notifications:
    post:
      description: Publish a backend-classified GTM Engineer user notification through Portal
      operationId: gtm-engineer-notification-create
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishGtmEngineerUserNotificationInputBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Publish GTM Engineer notification
      tags:
      - GTM Engineer
  /v1/gtm-engineer/{id}/submit-billing:
    post:
      operationId: gtm-engineer-submit-billing
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitGtmEngineerBillingInputBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Submit billing for a gtm-engineer session
      tags:
      - GTM Engineer
  /v1/sessions/{id}/gtm-engineer/assets-upload-url:
    get:
      description: Create a presigned URL for uploading gtm-engineer session assets to S3
      operationId: gtm-engineer-asset-upload-url-create
      parameters:
      - description: GTM Engineer session ID
        in: path
        name: id
        required: true
        schema:
          description: GTM Engineer session ID
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGtmEngineerAssetUploadUrlBody'
          description: OK
          headers:
            content-type:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error
      summary: Create a gtm-engineer session asset upload URL
      tags:
      - GTM Engineer
components:
  schemas:
    StartGtmEngineerAgentDraftRequest:
      additionalProperties: false
      properties:
        initialPrompt:
          description: Prompt describing the requested changes for Agent Builder.
          type: string
        timeoutMinutes:
          description: Detached VICE idle timeout in minutes. Defaults to GTM_ENGINEER_DETACHED_VICE_TIMEOUT_MINUTES.
          format: int64
          maximum: 1440
          minimum: 1
          type: integer
      required:
      - initialPrompt
      type: object
    CreateGtmEngineerAgentAsyncInvocationRequest:
      additionalProperties: false
      properties:
        configVars:
          description: Config variables JSON override.
          type: string
        invocationType:
          description: Invocation type (Manual or Trigger). Defaults to Manual.
          enum:
          - Manual
          - Trigger
          type: string
        triggerMetadata:
          additionalProperties: {}
          description: Non-PII trigger metadata for the invocation
          type: object
        triggerPayload:
          description: Hidden runtime trigger payload for trigger-based invocations. This is injected into wf.getTriggerPayload() and is not exposed through automation parameters.
          type: string
        version:
          description: Agent version to run. Defaults to the published version.
          format: int64
          type: integer
      type: object
    GtmEngineerConfig:
      additionalProperties: false
      properties:
        assistantMode:
          enum:
          - mark
          - agent-director
          type: string
        imageTag:
          type: string
        prompt:
          type: string
        targetAgentId:
          format: uuid
          type: string
        targetAgentName:
          readOnly: true
          type: string
        terminateExisting:
          type: boolean
        timeoutMinutes:
          format: int64
          type: integer
      type: object
    StartGtmEngineerAgentDraftResponse:
      additionalProperties: false
      properties:
        activeBuilderSession:
          $ref: '#/components/schemas/StartGtmEngineerAgentViceSessionResponse'
          description: Existing detached Agent Builder session when draft work is already active
        agentId:
          description: Agent ID attached to the draft
          type: string
        agentName:
          description: Agent display name
          type: string
        draftInitialPrompt:
          description: Initial prompt on an existing dormant draft
          type: string
        draftUpdatedAt:
          description: Last update timestamp for an existing dormant draft
          format: date-time
          type: string
        draftVersion:
          description: Draft version being edited
          format: int64
          type: integer
        message:
          description: Human-readable status message for non-started outcomes
          type: string
        session:
          $ref: '#/components/schemas/StartGtmEngineerAgentViceSessionResponse'
          description: Detached VICE session started for Agent Builder
        status:
          description: Whether new draft work started, an existing builder session was found, or draft work was blocked
          type: string
      required:
      - agentId
      - agentName
      - status
      type: object
    GtmEngineerSession:
      additionalProperties: false
      properties:
        config:
          $ref: '#/components/schemas/GtmEngineerConfig'
        createdAt:
          format: date-time
          type: string
        endedAt:
          format: date-time
          type: string
        endedReason:
          type: string
        gtmChatId:
          type: string
        id:
          type: string
        reusedExistingSession:
          type: boolean
        startedAt:
          format: date-time
          type: string
        status:
          type: string
      required:
      - id
      - status
      - createdAt
      type: object
    AvariceKeepaliveData:
      additionalProperties: false
      properties:
        agentId:
          description: Agent id associated with the Avarice build.
          type: string
        avariceChatId:
          description: Avarice chat id associated with the keepalive.
          type: string
        avariceRunId:
          description: Avarice local run id associated with the keepalive.
          format: int64
          type: integer
        avariceSessionId:
          description: Avarice browser session id associated with the keepalive.
          type: string
        currentPhase:
          description: Avarice current phase and one-based sequence, for example testing-1.
          type: string
        reason:
          description: 'Avarice keepalive reason: start, interval, or final.'
          type: string
        status:
          description: Avarice run status associated with the keepalive.
          type: string
      type: object
    RawAgentInvocationWithAgentData:
      additionalProperties: false
      properties:
        agentId:
          type: string
        agentName:
          type: string
        agentVersion:
          format: int64
          type: integer
        agentVersionIsDraft:
          type: boolean
        aiUsageCredits:
          format: float
          type: number
        callbackConfig:
          $ref: '#/components/schemas/CallbackConfig'
        code:
          type: string
        completedAt:
          format: date-time
          type: string
        configVars:
          additionalProperties: {}
          type: object
        cpuUsageCredits:
          format: float
          type: number
        createdAt:
          format: date-time
          type: string
        creditsFinalized:
          type: boolean
        error:
          description: Invocation error. Oversized error details are truncated with a marker.
          type: string
        errorCode:
          type: string
        id:
          type: string
        invocationType:
          type: string
        log:
          description: Invocation log. Omitted from list responses and when a detail log exceeds the response size limit.
          type: string
        logSizeBytes:
          description: Full invocation log size in bytes, including when log is omitted.
          format: int64
          type: integer
        mcpSessionId:
          type: string
        output:
          description: Invocation result. Omitted from list responses and when a detail result exceeds the response size limit.
          type: string
        profileName:
          type: string
        proxyUsageCredits:
          format: float
          type: number
        sessionId:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
        statusUpdatedAt:
          format: date-time
          type: string
        subagentRuns:
          items:
            $ref: '#/components/schemas/RawAgentInvocationSubagentRun'
          type:
          - array
          - 'null'
        totalCreditsUsed:
          format: float
          type: number
        triggerMetadata:
          additionalProperties: {}
          type: object
        userId:
          type: string
        webhookId:
          type: string
      required:
      - agentName
      - id
      - agentId
      - status
      - createdAt
      - invocationType
      type: object
    IntegrationApiProxyResponseBody:
      additionalProperties: false
      properties:
        body:
          description: JSON body returned by the upstream provider, when parseable as JSON.
        bodyText:
          description: Text body returned by the upstream provider, when not parseable as JSON.
          type: string
        headers:
          additionalProperties:
            type: string
          description: Filtered response headers returned by the upstream provider.
          type: object
        statusCode:
          description: HTTP status code returned by the upstream provider.
          format: int64
          type: integer
      required:
      - statusCode
      - headers
      type: object
    CreateAsyncAgentInvocationBody:
      additionalProperties: false
      properties:
        invocation_id:
          description: invocation id
          format: uuid
          type: string
      required:
